<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Boterm</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="terminal.css">
</head>
<body>
<nav id="workspaces" aria-label="Projetos"></nav>
<div id="workspace-body">
<aside id="sidebar" aria-label="Sessões da equipe">
  <div class="section-label">TERMINAIS</div>
  <div id="sessions"></div>
  <button id="new-session" type="button">＋ Terminal</button>
  <button id="split" type="button" aria-pressed="false">◫ Dividir</button>
  <p class="sidebar-hint">Sessões deste projeto compartilham mensagens e saída com a equipe.</p>
</aside>
<div id="stage">
<div id="terminal-actions"><span id="session-label"></span><div><select id="agent-kind" aria-label="Agente"><option value="codex">◇ Codex</option><option value="claude">✳ Claude</option><option value="gemini">✦ Gemini</option><option value="opencode">⌘ OpenCode</option></select><button id="launch-agent" type="button">Iniciar</button><button id="copy-text" type="button">Copiar</button><button id="paste-text" type="button">Colar</button><button id="rename-session" type="button">Renomear</button><button id="close-session" type="button" aria-label="Fechar terminal">×</button></div></div>
<main id="terminal" aria-label="Sessões de terminal"></main>
<section id="voice-panel" aria-label="Voice dictation" hidden>
  <div class="voice-info">
    <div><strong id="voice-status" role="status">Preparing microphone…</strong><p id="voice-hint">Audio stays on your Mac.</p></div>
    <time id="voice-time" aria-label="Recorded audio duration">0:00</time>
  </div>
  <div class="voice-actions">
    <button id="voice-pause" type="button">Pause</button>
    <button id="voice-stop" type="button">Stop &amp; insert</button>
    <button id="voice-cancel" type="button">Cancel</button>
  </div>
  <div class="voice-history" aria-label="Recent microphone intensity, last 20 seconds, with pauses marked">
    <svg id="voice-wave" viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true">
      <line x1="0" y1="32" x2="1000" y2="32" class="wave-baseline" />
      <path id="voice-envelope" d="M0,32 L1000,32" />
      <g id="voice-pauses"></g>
      <line x1="999" y1="3" x2="999" y2="61" class="wave-now" />
    </svg>
    <div class="voice-scale"><span>−20s · recent voice activity</span><span>Now</span></div>
  </div>
</section>
</div></div>
<details id="team"><summary>Equipe · mensagens entre agentes <span id="message-count">0</span></summary>
<div id="team-log" role="log" aria-label="Mensagens da equipe" aria-live="polite"></div>
<form id="team-form"><select id="recipient" aria-label="Destinatário"></select><input id="team-text" aria-label="Mensagem" placeholder="Mensagem para a equipe…" maxlength="16000" required><button type="submit">Enviar</button></form>
</details>
<script src="vendor/xterm.js"></script><script src="vendor/addon-fit.js"></script><script src="theme.js"></script><script src="shortcuts.js"></script><script src="workspace.js"></script><script src="drop-paths.js"></script><script src="voice-wave.js"></script><script src="terminal.js"></script></body>
</html>
